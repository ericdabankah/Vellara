name: Database migration verification

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/database-migrations.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay-and-test:
    name: Fresh migration replay and pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.119.0

      - name: Start isolated local Supabase stack
        run: |
          supabase start --runtime native --exclude rest,realtime,storage,functions,studio,mail,analytics,pooler

      - name: Replay every migration from an empty database
        run: supabase db reset

      - name: Run database tests
        run: supabase test db

      - name: Run PostgreSQL function lint
        run: supabase db lint --level error

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop
