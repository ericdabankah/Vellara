name: E.164 Constraint CI

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - ".github/workflows/e164-constraint-ci.yml"
  push:
    branches:
      - "fix/e164-phone-constraints-forward-migration"
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - ".github/workflows/e164-constraint-ci.yml"

jobs:
  postgres-migration-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vellara_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vellara_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Replay E.164 correction and verify constraints
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: vellara_test
        run: psql --set ON_ERROR_STOP=1 --file supabase/tests/e164_phone_constraints_test.sql
